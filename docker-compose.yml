# Orquestracao local do VesteBem (backend + frontend).
#
# Uso:
#   1. Preencha backend/.env com as credenciais do Firebase Admin.
#   2. Copie .env.example para .env (nesta pasta) e preencha as VITE_*.
#   3. docker compose up --build
#
# Frontend em http://localhost:8080  |  Backend em http://localhost:3000
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      # Sobrescreve para liberar o front servido pelo nginx neste compose
      - PORT=3000
      - CORS_ORIGINS=http://localhost:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # As VITE_* sao build args (Vite injeta no bundle em tempo de build)
      args:
        VITE_API_URL: http://localhost:3000
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
