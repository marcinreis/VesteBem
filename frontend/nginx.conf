server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota desconhecida cai no index.html para o BrowserRouter
  # do React Router resolver no cliente (equivalente ao rewrite do vercel.json).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
